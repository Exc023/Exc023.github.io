<!DOCTYPE html>
<html lang="zh-Hans" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>exc0 · OneHistory</title>
  <meta name="description" content="exc0 远程代理。OneHistory 个人品牌与公开项目目录。">
  <style>
    :root, html[data-theme="light"] {
      --canvas: #F5F6F7;
      --surface: #FFFFFF;
      --surface-alt: #F5F6F8;
      --surface-hover: #ECEEF1;
      --text: #1F2328;
      --text-2: #6B7280;
      --text-disabled: #A1A7B0;
      --accent: #A87A12;
      --accent-hover: #8C650E;
      --accent-soft: #FAF0D8;
      --hairline: #E4E7EB;
      --border: #D8DCE2;
      --on-accent: #FFFFFF;
    }
    html[data-theme="dark"] {
      --canvas: #1A1D1C;
      --surface: #1D201F;
      --surface-alt: #242625;
      --surface-hover: #2A2D2C;
      --text: #E2DAC6;
      --text-2: #ACA593;
      --text-disabled: #77746A;
      --accent: #D9A441;
      --accent-hover: #E8B65C;
      --accent-soft: #33342A;
      --hairline: #2A2D2C;
      --border: #343736;
      --on-accent: #171918;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      background: var(--canvas);
      color: var(--text);
      font-family: "Microsoft YaHei UI", "Segoe UI", "PingFang SC", "Noto Sans SC", sans-serif;
      font-size: 13px;
      line-height: 1.45;
    }
    .top {
      height: 32px;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 12px;
      background: var(--surface);
      border-bottom: 1px solid var(--hairline);
    }
    .brand { font-weight: 600; }
    .sep { color: var(--text-disabled); }
    .grow { flex: 1; }
    .muted { color: var(--text-2); }
    .mono { font-family: Consolas, "IBM Plex Mono", ui-monospace, monospace; font-size: 12px; }
    button {
      height: 28px;
      min-width: 28px;
      padding: 0 10px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font: inherit;
      cursor: pointer;
    }
    button:hover { background: var(--surface-hover); }
    button.primary {
      background: var(--accent);
      color: var(--on-accent);
      border-color: transparent;
      font-weight: 400;
    }
    button.primary:hover { background: var(--accent-hover); }
    button.tab[aria-selected="true"] {
      background: var(--accent-soft);
      border-color: transparent;
      font-weight: 600;
    }
    a { color: var(--accent); text-decoration: none; }
    a:hover { color: var(--accent-hover); text-decoration: underline; }
    main { padding: 12px; max-width: 960px; margin: 0 auto; }
    .lead { color: var(--text-2); margin: 0 0 12px; }
    .tabs { display: flex; gap: 8px; margin: 0 0 12px; flex-wrap: wrap; }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 6px 8px; vertical-align: top; border-bottom: 1px solid var(--hairline); }
    th { color: var(--text-2); font-weight: 600; font-size: 11px; }
    td.num { font-family: Consolas, ui-monospace, monospace; font-size: 12px; white-space: nowrap; }
    caption { text-align: left; font-weight: 600; padding: 0 0 8px; caption-side: top; }
    .note { color: var(--text-2); font-size: 11px; margin: 12px 0 0; }
    .hidden { display: none; }
    @media (max-width: 520px) {
      .hide-sm { display: none; }
    }
  </style>
</head>
<body>
  <header class="top">
    <span class="brand">exc0</span>
    <span class="sep">/</span>
    <span>OneHistory</span>
    <span class="grow"></span>
    <button type="button" id="theme" title="切换浅色或深色">深色</button>
  </header>
  <main>
    <p class="lead">远程代理，一台自己的电脑。个人小品牌是 OneHistory。下面只列 GitHub 上公开可见的仓库；公司资料未公开的不在这里。</p>
    <p class="lead mono">
      <a href="https://github.com/Exc023">Exc023</a>
      · <a href="mailto:exc0@outlook.com">exc0@outlook.com</a>
      · 主体项目 <a href="https://github.com/cyx3705">cyx3705</a>
    </p>
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" aria-selected="true" data-tab="tools">OneHistory</button>
      <button class="tab" role="tab" aria-selected="false" data-tab="works">主体项目</button>
    </div>

    <section id="panel-tools">
      <table>
        <caption>项目管理与工作流工具</caption>
        <thead>
          <tr><th>编号</th><th>名称</th><th class="hide-sm">说明</th></tr>
        </thead>
        <tbody id="tools-body"></tbody>
      </table>
    </section>

    <section id="panel-works" class="hidden">
      <table>
        <caption>主体项目 · xxxx-xxx</caption>
        <thead>
          <tr><th>编号</th><th>名称</th><th class="hide-sm">说明</th></tr>
        </thead>
        <tbody id="works-body"></tbody>
      </table>
      <p class="note">未写进 README 的模板仓、以及未公开仓库都不列出。</p>
    </section>
  </main>
  <script>
    const tools = [
      ["2026-023", "HistoryVulcan", "宿主、命令总线、模块生命周期", "https://github.com/cyx3705/2026-023"],
      ["2026-021", "HistoryMercury", "活动坞、快捷键、命令工作台", "https://github.com/cyx3705/2026-021"],
      ["2026-020", "HistoryJanus", "项目与 Git 治理", "https://github.com/cyx3705/2026-020"],
      ["2026-019", "HistoryDiana", "AI 工作区与模块开发管线", "https://github.com/cyx3705/2026-019"],
      ["2026-024", "HistoryMinerva", "CAD 模块，注册到 Vulcan", "https://github.com/cyx3705/2026-024"],
      ["HistoryVesta", "HistoryVesta", "多项目仓库，分支 + worktree", "https://github.com/cyx3705/HistoryVesta"],
      ["0000-001", "AIReady", "OneHistory AI 优先项目模板", "https://github.com/cyx3705/0000-001-AIReady"],
      ["2026-018", "MyAPI", "后端模块运行时探索", "https://github.com/cyx3705/2026-018"]
    ];
    const works = [
      ["2026-022", "WBall", "落球对战模拟器", "https://github.com/cyx3705/2026-022"],
      ["2026-016", "AD学习", "Altium 学习与实验归档", "https://github.com/cyx3705/2026-016"],
      ["2026-012", "便携式自动冷萃咖啡机", "双舱循环，ESP32-S3 + Windows 上位机", "https://github.com/cyx3705/2026-012"],
      ["2026-010", "西门子PLC实践", "PLC 实践", "https://github.com/cyx3705/2026-010"],
      ["2026-007", "三维坐标机器", "三轴直角坐标机器人", "https://github.com/cyx3705/2026-007"],
      ["2026-006", "伟立杯手套", "绳传动力反馈数据手套", "https://github.com/cyx3705/2026-006"],
      ["2026-003", "中型AGV小车", "AGV", "https://github.com/cyx3705/2026-003"],
      ["2025-015", "弹簧测试机械", "弹簧测试", "https://github.com/cyx3705/2025-015"],
      ["2025-014", "减速机课程设计", "带式输送机传动系统", "https://github.com/cyx3705/2025-014"],
      ["2025-013", "三十年战争研究", "欧洲政治格局", "https://github.com/cyx3705/2025-013"],
      ["2025-012", "小型作业集合", "作业统一管理", "https://github.com/cyx3705/2025-012"],
      ["2025-010", "墙面瓷砖自动铺设装置", "铺砖装置", "https://github.com/cyx3705/2025-010"],
      ["2025-009", "沙拉售卖机", "售卖机", "https://github.com/cyx3705/2025-009"],
      ["2025-008", "机器人手部快换装置", "快换装置", "https://github.com/cyx3705/2025-008"],
      ["2025-007", "仿生风滚草", "仿生机构", "https://github.com/cyx3705/2025-007"],
      ["2025-006", "机器人学作业", "课程作业", "https://github.com/cyx3705/2025-006"],
      ["2025-005", "颠覆式创新", "文化课作业", "https://github.com/cyx3705/2025-005"],
      ["2025-004", "迎宾机器人", "迎宾机器人", "https://github.com/cyx3705/2025-004"],
      ["2025-003", "光伏货架车", "光伏货架车", "https://github.com/cyx3705/2025-003"],
      ["2025-002", "轻型 AGV 小车", "轻型 AGV", "https://github.com/cyx3705/2025-002"]
    ];
    function rows(list) {
      return list.map(([id, name, note, url]) =>
        `<tr><td class="num"><a href="${url}">${id}</a></td><td>${name}</td><td class="hide-sm muted">${note}</td></tr>`
      ).join("");
    }
    document.getElementById("tools-body").innerHTML = rows(tools);
    document.getElementById("works-body").innerHTML = rows(works);

    const root = document.documentElement;
    const themeBtn = document.getElementById("theme");
    function applyTheme(t) {
      root.setAttribute("data-theme", t);
      themeBtn.textContent = t === "dark" ? "深色" : "浅色";
      localStorage.setItem("exc0-theme", t);
    }
    applyTheme(localStorage.getItem("exc0-theme") || "dark");
    themeBtn.addEventListener("click", () => {
      applyTheme(root.getAttribute("data-theme") === "dark" ? "light" : "dark");
    });
    document.querySelectorAll(".tab").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".tab").forEach(b => b.setAttribute("aria-selected", b === btn));
        const id = btn.dataset.tab;
        document.getElementById("panel-tools").classList.toggle("hidden", id !== "tools");
        document.getElementById("panel-works").classList.toggle("hidden", id !== "works");
      });
    });
  </script>
</body>
</html>
